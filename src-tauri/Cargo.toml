[package]
name = "meister"
version = "0.1.0"
description = "Recording to minutes formatter"
authors = []
license = ""
repository = ""
default-run = "meister"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "meister_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "meister"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
tempfile = "3"
anyhow = "1"
whisper-rs = { version = "0.11", features = ["coreml", "metal"] }
hound = "3"
futures-util = "0.3"
zip = "0.6"
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
regex = "1"
screencapturekit = "1"
cpal = "0.17"

[dev-dependencies]
axum = "0.7"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = [
    "NSDistributedNotificationCenter",
    "NSNotification",
    "NSObject",
    "NSOperation",
    "NSString",
    "block2",
] }
objc2-app-kit = { version = "0.2", features = [
    "NSAccessibility",
    "NSAppearance",
    "NSColor",
    "NSColorSpace",
    "NSGraphics",
    "NSResponder",
    "NSView",
    "NSVisualEffectView",
    "NSWindow",
    "NSWorkspace",
    "block2",
] }
block2 = "0.5"
